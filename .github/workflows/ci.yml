name: CI

on: [pull_request]

# Least-privilege token for all jobs (only needs repo read)
permissions:
  contents: read

# Cancel superseded runs for the *same workflow & ref* (unique group per workflow).
# Prevents redundant minutes when pushing multiple times to one PR.
# See: docs on concurrency groups.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'              # built-in cache for ~/.npm keyed by package-lock.json
      - run: npm ci                 # lockfile present in repo -> deterministic install
      - run: npm run check          # markdownlint

  build_epub:
    name: build_epub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-xetex lmodern librsvg2-bin
      - run: make epub

  build_pdf:
    name: build_pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-xetex lmodern librsvg2-bin
      - run: make pdf

  test_site:
    name: test_site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Playwright builds the site and starts its own static preview server.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
